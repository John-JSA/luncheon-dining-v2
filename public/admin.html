<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Dashboard | Luncheon Dining</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f9f7f0}.admin-wrap{max-width:1200px;margin:65px auto;padding:0 20px}.admin-header{display:flex;align-items:center;justify-content:space-between;gap:16px}.admin-header h1{font-size:42px}.auth{display:flex;gap:10px;margin:22px 0}.auth input{max-width:390px}.admin-tabs{display:flex;gap:10px;margin:25px 0}.records{display:grid;gap:15px}.record{padding:23px;border:1px solid #e3dccd;border-radius:12px;background:white;line-height:1.6;overflow-wrap:anywhere}.record h3{margin-bottom:3px}.record small{color:#8d825f}.record pre{white-space:pre-wrap;font:12px 'DM Sans',sans-serif;background:#f5f1e8;padding:12px;border-radius:7px}.record select{max-width:190px}.record-details{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;margin:15px 0}.error{color:#a53026}@media(max-width:650px){.admin-header,.auth{display:block}.record-details{grid-template-columns:1fr}}</style></head><body><header class="header"><a class="brand" href="/"><span class="brand-icon">♨</span><span><strong>LUNCHEON</strong><small>— D I N I N G —</small></span></a><a href="/" class="button outline small">← Back to website</a></header><main class="admin-wrap"><div class="admin-header"><div><div class="eyebrow">STAFF ONLY</div><h1>Operations Dashboard</h1></div></div><p>Review stored orders, event reservations and customer enquiries. Access is protected by the server's admin token.</p><div class="auth"><input id="token" type="password" placeholder="Admin access token" aria-label="Admin token"><button class="button gold" id="load">Unlock dashboard</button></div><div class="admin-tabs"><button class="tab active" data-table="orders">Orders</button><button class="tab" data-table="reservations">Reservations</button><button class="tab" data-table="contacts">Contacts</button></div><p id="feedback" role="status"></p><div id="records" class="records"></div></main><script src="/admin.js"></script></body></html>
