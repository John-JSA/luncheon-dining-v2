
name: Restaurant Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-website:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Verify repository files
        run: |
          echo "Starting restaurant website checks"
          ls -la
          echo "Repository check completed"
